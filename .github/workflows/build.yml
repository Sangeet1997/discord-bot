name: discord-bot-builder

on:
  push:
    branches: [main]

env:
  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

jobs:
  container-builder:
    runs-on: self-hosted
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      
      - name: echo secret
        run: echo "$DISCORD_TOKEN"
      
      - name: add secrets
        run: export DISCORD_TOKEN="$DISCORD_TOKEN"
      
      - name: echo var
        run: echo $DISCORD_TOKEN

      - name: Stop delete containers
        run: docker compose down

      - name: Start Containers
        run: docker compose up -d --build